  <p>实际访问由本机 rclone、WinFsp 和 Google Drive 提供，并受其各自条款及技术条件约束。云盘访问需要网络；文件写入本地缓存后，上传可能仍在后台进行。使用者应确认上传状态，再停止程序或清理缓存。</p>
  <p>本网站仅提供说明，不接受账号密码、授权令牌或文件上传。项目说明不构成对可用性、上传速度或数据恢复的额外承诺。</p>
